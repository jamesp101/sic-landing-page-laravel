; PHP limits for hosts that read per-directory ini files (cPanel: PHP-FPM, LiteSpeed, CGI). The largest multipart
; upload is a 20 MB Download; images are converted in memory. MultiPHP INI Editor values override these.
upload_max_filesize = 24M
post_max_size = 26M
memory_limit = 512M
max_execution_time = 120
max_input_time = 300
